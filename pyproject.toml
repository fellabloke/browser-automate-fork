[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-first-ide"
version = "0.1.0"
description = "Dual-model LangGraph browser automation orchestrator with Supervisor + Worker VLM architecture."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "SandeepAi369" },
]
keywords = ["langgraph", "browser-automation", "playwright", "ai-agent"]

dependencies = [
    "pydantic>=2.12.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=2.1.0",
    "langsmith>=0.4.0",
    "httpx>=0.28.0",
    "playwright>=1.55.0",
    "playwright-stealth>=2.0.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.15",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["python-orchestrator"]

[tool.ruff]
target-version = "py311"
line-length = 110
fix = false
exclude = [".agents", "agents", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Run the deterministic orchestration tests and regression suite.
# Browser/provider/manual checks live outside the default validation boundary.
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--ignore=tests/integration/test_antibot_v22.py",
    "--ignore=tests/integration/test_perception_v19.py",
]
